<style>
  /* Layout: one-screen app. Title, inputs, one big result, tab bar pinned at the bottom.
     Single dark theme by choice, carried over from the original iPhone app. */
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --panel: rgba(0, 0, 0, 0.6);
    --field: #f1f2f4;
    --field-text: #101114;
    --text: #ffffff;
    --muted: #a9adb5;
    --car: #c8202b;
    --mpg: #1f9d4c;
    --cost: #cf2f36;
    --line: rgba(255, 255, 255, 0.14);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .car {
    position: absolute;
    left: 50%;
    bottom: 18%;
    width: min(150%, 760px);
    transform: translateX(-50%);
    opacity: 0.4;
    pointer-events: none;
    transition: transform 0.35s ease;
  }
  .app[data-tab="cost"] .car { transform: translateX(-50%) scaleX(-1); }
  @media (prefers-reduced-motion: reduce) { .car { transition: none; } }

  main {
    position: relative;
    flex: 1;
    overflow-y: auto;
    padding: calc(env(safe-area-inset-top) + 28px) max(20px, env(safe-area-inset-right)) 24px max(20px, env(safe-area-inset-left));
  }
  .view {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    max-width: 340px;
    margin: 0 auto;
  }
  .view[hidden] { display: none; }
  h1 {
    margin: 0;
    padding: 12px 20px;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    text-wrap: balance;
    background: var(--panel);
    border-radius: 12px;
  }
  .fields { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-weight: 700; font-size: 16px; }
  input {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: var(--field-text);
    background: var(--field);
    border: 2px solid transparent;
    border-radius: 10px;
    outline: none;
  }
  input::placeholder { color: #8b8f97; }
  input:focus-visible { border-color: #4da3ff; }
  .result {
    width: 100%;
    max-width: 290px;
    padding: 16px 16px 18px;
    text-align: center;
    border-radius: 15px;
  }
  .result.mpg { background: var(--mpg); }
  .result.cost { background: var(--cost); }
  .result .caption { font-size: 17px; font-weight: 600; }
  .result output {
    display: block;
    margin-top: 2px;
    font-size: 44px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .note {
    margin: 0;
    font-size: 13px;
    line-height: 1.4;
    color: var(--muted);
    text-align: center;
    background: var(--panel);
    padding: 8px 12px;
    border-radius: 10px;
  }

  nav {
    position: relative;
    display: flex;
    background: rgba(18, 19, 22, 0.94);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 4px 8px;
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: 0;
    cursor: pointer;
  }
  nav button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav button[aria-selected="true"] { color: #4da3ff; }
  nav button:focus-visible { outline: 2px solid #4da3ff; outline-offset: -4px; border-radius: 8px; }
</style>
</head>
<body>
<div class="app" id="app" data-tab="mpg">

  <svg class="car" viewBox="0 0 400 140" aria-hidden="true">
    <path fill="var(--car)" d="M10 104 Q8 82 40 76 L112 66 Q152 30 212 30 L258 30 Q300 32 332 66 L374 76 Q394 82 390 104 L352 104 A32 32 0 0 0 288 104 L132 104 A32 32 0 0 0 68 104 Z"/>
    <path fill="#0b0c0e" opacity="0.75" d="M130 66 Q160 40 208 40 L214 40 L214 66 Z M224 40 L256 40 Q286 42 312 66 L224 66 Z"/>
    <circle cx="100" cy="104" r="25" fill="#17181b"/><circle cx="100" cy="104" r="11" fill="#8d9199"/>
    <circle cx="320" cy="104" r="25" fill="#17181b"/><circle cx="320" cy="104" r="11" fill="#8d9199"/>
  </svg>

  <main>
    <section class="view" id="view-mpg" role="tabpanel" aria-labelledby="tab-mpg">
      <h1>MPG Equivalent</h1>
      <div class="fields">
        <div class="field">
          <label for="mi-per-kwh">Miles per kWh</label>
          <input id="mi-per-kwh" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.31">
        </div>
      </div>
      <div class="result mpg">
        <div class="caption">Equivalent MPG</div>
        <output id="out-mpg" for="mi-per-kwh">0.00</output>
      </div>
      <p class="note">Uses the EPA figure of 33.7 kWh per gallon of gasoline.</p>
    </section>

    <section class="view" id="view-cost" role="tabpanel" aria-labelledby="tab-cost" hidden>
      <h1>Charging Cost</h1>
      <div class="fields">
        <div class="field">
          <label for="cost-per-kwh">Cost per kWh ($)</label>
          <input id="cost-per-kwh" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
        </div>
        <div class="field">
          <label for="total-kwh">Total kWh</label>
          <input id="total-kwh" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
        </div>
      </div>
      <div class="result cost">
        <div class="caption">Total Cost</div>
        <output id="out-cost" for="cost-per-kwh total-kwh">$0.00</output>
      </div>
    </section>
  </main>

  <nav role="tablist" aria-label="Calculators">
    <button id="tab-mpg" role="tab" aria-controls="view-mpg" aria-selected="true" data-tab="mpg">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 14l4-5"/><circle cx="12" cy="14" r="1.4"/></svg>
      MPG Equivalent
    </button>
    <button id="tab-cost" role="tab" aria-controls="view-cost" aria-selected="false" data-tab="cost">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>
      Charging Cost
    </button>
  </nav>
</div>

<script>
(function () {
  var EPA_KWH_PER_GALLON = 33.7;
  var STORE_KEY = 'emph-values';
  var app = document.getElementById('app');
  var inputs = {
    mi: document.getElementById('mi-per-kwh'),
    cost: document.getElementById('cost-per-kwh'),
    kwh: document.getElementById('total-kwh')
  };
  var outMpg = document.getElementById('out-mpg');
  var outCost = document.getElementById('out-cost');

  // Accepts "2.31" or "2,31"; anything unreadable counts as 0, like the original app.
  function num(text) {
    var n = parseFloat(String(text).replace(',', '.'));
    return isFinite(n) ? n : 0;
  }

  function update() {
    outMpg.textContent = (num(inputs.mi.value) * EPA_KWH_PER_GALLON).toFixed(2);
    outCost.textContent = '$' + (num(inputs.cost.value) * num(inputs.kwh.value)).toFixed(2);
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        mi: inputs.mi.value, cost: inputs.cost.value, kwh: inputs.kwh.value
      }));
    } catch (e) { /* storage unavailable: the calculator still works */ }
  }

  function showTab(name) {
    if (name !== 'cost') name = 'mpg';
    app.dataset.tab = name;
    document.getElementById('view-mpg').hidden = name !== 'mpg';
    document.getElementById('view-cost').hidden = name !== 'cost';
    document.getElementById('tab-mpg').setAttribute('aria-selected', String(name === 'mpg'));
    document.getElementById('tab-cost').setAttribute('aria-selected', String(name === 'cost'));
  }

  // Restore the last values used on this device; first visit shows worked examples.
  var saved = { mi: '2.31', cost: '0.32', kwh: '40' };
  try {
    var stored = JSON.parse(localStorage.getItem(STORE_KEY));
    if (stored && typeof stored === 'object') saved = stored;
  } catch (e) { /* keep the examples */ }
  inputs.mi.value = saved.mi || '';
  inputs.cost.value = saved.cost || '';
  inputs.kwh.value = saved.kwh || '';

  Object.keys(inputs).forEach(function (key) {
    inputs[key].addEventListener('input', update);
    // Select the old value on tap so typing replaces it.
    inputs[key].addEventListener('focus', function () {
      var el = this;
      setTimeout(function () { try { el.select(); } catch (e) {} }, 0);
    });
  });

  document.querySelectorAll('nav button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      showTab(btn.dataset.tab);
      try { history.replaceState(null, '', '#' + btn.dataset.tab); } catch (e) { location.hash = btn.dataset.tab; }
    });
  });

  // Tapping the background dismisses the keyboard, as in the original.
  document.querySelector('main').addEventListener('click', function (e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL' && document.activeElement && document.activeElement.blur) {
      document.activeElement.blur();
    }
  });

  window.addEventListener('hashchange', function () { showTab(location.hash.slice(1)); });
  showTab(location.hash.slice(1));
  update();
})();
</script>
</body>
</html>
